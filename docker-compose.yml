services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - cloudscale-data:/app/data
    environment:
      - CLOUDSCALE_DB=/app/data/cloudscale.db
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend
volumes:
  cloudscale-data:
