apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-deployment
  namespace: sla-autoscaling
  labels:
    app: webapp
    tier: microservice
spec:
  # Start with one pod on the 2 GiB prototype node. Add an HPA only after
  # metrics-server and workload behavior have been verified.
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: webapp
          image: cloudscale-workload:prototype
          # The image is imported into this K3s node's containerd from a local archive.
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
