apiVersion: v1
kind: ServiceAccount
metadata:
  name: adaptive-controller-sa
  namespace: sla-autoscaling
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: adaptive-controller-role
  namespace: sla-autoscaling
rules:
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    resourceNames: ["webapp-hpa"]
    verbs: ["get", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["cloudscale-controller-lock"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: adaptive-controller-binding
  namespace: sla-autoscaling
subjects:
  - kind: ServiceAccount
    name: adaptive-controller-sa
    namespace: sla-autoscaling
roleRef:
  kind: Role
  name: adaptive-controller-role
  apiGroup: rbac.authorization.k8s.io
